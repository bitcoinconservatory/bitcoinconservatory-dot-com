<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 600"
     width="800"
     height="600"
     preserveAspectRatio="xMidYMid meet">

  <!-- Dark Mode Background -->
  <rect x="0" y="0" width="800" height="600" fill="#0a0a0c"/>

  <!-- 3D Wireframe Curve (secp256k1 abstraction) -->
  <g fill="none"
     stroke="#7A8B99"
     stroke-width="2.5"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- Outermost Strand -->
    <path transform="translate(400 320) scale(1.00) translate(-400 -320)"
          d="
            M 680,120
            C 550,270 480,290 400,200
            C 320,110 120,140 120,320
            C 120,500 300,550 400,440
            C 480,350 550,370 680,520
          "/>

    <!-- Outer-mid Strand -->
    <path transform="translate(400 320) scale(0.94) translate(-400 -320)"
          d="
            M 680,120
            C 550,270 480,290 400,200
            C 320,110 120,140 120,320
            C 120,500 300,550 400,440
            C 480,350 550,370 680,520
          "/>

    <!-- Middle Strand -->
    <path transform="translate(400 320) scale(0.88) translate(-400 -320)"
          d="
            M 680,120
            C 550,270 480,290 400,200
            C 320,110 120,140 120,320
            C 120,500 300,550 400,440
            C 480,350 550,370 680,520
          "/>

    <!-- Inner-mid Strand -->
    <path transform="translate(400 320) scale(0.82) translate(-400 -320)"
          d="
            M 680,120
            C 550,270 480,290 400,200
            C 320,110 120,140 120,320
            C 120,500 300,550 400,440
            C 480,350 550,370 680,520
          "/>

    <!-- Innermost Strand -->
    <path transform="translate(400 320) scale(0.76) translate(-400 -320)"
          d="
            M 680,120
            C 550,270 480,290 400,200
            C 320,110 120,140 120,320
            C 120,500 300,550 400,440
            C 480,350 550,370 680,520
          "/>

  </g>

</svg>
